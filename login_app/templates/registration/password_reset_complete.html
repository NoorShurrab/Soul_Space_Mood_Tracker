{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - SoulSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#fcfbfe] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-gray-800 relative overflow-x-hidden">

    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-[#d8f1e6] blur-[120px] opacity-70"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[55vw] h-[55vw] rounded-full bg-[#fbe2f3] blur-[130px] opacity-75"></div>
    </div>

    <div class="w-full max-w-md flex flex-col items-center relative z-10">
        <div class="w-12 h-12 bg-emerald-500 text-white rounded-2xl flex items-center justify-center text-xl mb-4 shadow-lg shadow-emerald-500/30 select-none">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        
        <h2 class="text-3xl font-bold text-gray-900 tracking-tight text-center">Password Updated!</h2>
        <p class="text-sm text-gray-500 mt-1 mb-6 text-center">Your password has been changed successfully.</p>

        <div class="w-full bg-white/80 backdrop-blur-md rounded-[24px] p-8 shadow-sm border border-white/70 text-center space-y-4">
            <p class="text-sm text-gray-600 leading-relaxed">
                You can now log in to your space using your new secure password.
            </p>
            <div class="pt-2">
                <a href="/login" class="inline-block w-full py-3.5 bg-[#9a89df] hover:bg-[#8571d7] text-white font-semibold rounded-xl text-sm shadow-md shadow-[#9a89df]/25 transition-all">
                    Sign In Now
                </a>
            </div>
        </div>
    </div>
</body>
</html>
