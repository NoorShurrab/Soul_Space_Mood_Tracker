{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SoulSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#fcfbfe] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-gray-800 relative overflow-x-hidden">

    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-[#d8f1e6] blur-[120px] opacity-70"></div>
        <div class="absolute top-[5%] right-[-5%] w-[45vw] h-[45vw] rounded-full bg-[#e1f0fa] blur-[100px] opacity-60"></div>
        <div class="absolute top-[40%] left-[-15%] w-[60vw] h-[60vw] rounded-full bg-[#e9e2fb] blur-[140px] opacity-60"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[55vw] h-[55vw] rounded-full bg-[#fbe2f3] blur-[130px] opacity-75"></div>
    </div>

    <div class="w-full max-w-md flex flex-col items-center relative z-10">
        <div class="w-12 h-12 bg-[#9a89df] text-white rounded-2xl flex items-center justify-center text-xl mb-4 shadow-lg shadow-[#9a89df]/30 select-none">
            <i class="fa-solid fa-key"></i>
        </div>
        
        <h2 class="text-3xl font-bold text-gray-900 tracking-tight text-center">Reset Password</h2>
        <p class="text-sm text-gray-500 mt-1 mb-6 text-center">Enter your email and we'll send you a link to reset your password.</p>

        <div class="w-full bg-white/80 backdrop-blur-md rounded-[24px] p-8 shadow-sm border border-white/70">
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                {% if form.email.errors %}
                    <div class="p-3 bg-red-50 border border-red-100 text-red-600 rounded-xl text-xs font-medium text-center">
                        {{ form.email.errors.0 }}
                    </div>
                {% endif %}
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1.5 pl-0.5">Email Address</label>
                    <div class="relative flex items-center">
                        <i class="fa-regular fa-envelope absolute left-4 text-gray-400 text-sm"></i>
                        
                        <input type="email" name="email" id="id_email" autocomplete="email" required placeholder="you@soulspace.io"
                            value="{{ form.email.value|default:'' }}"
                            class="w-full pl-11 pr-4 py-3 bg-[#eef2fa] border border-transparent rounded-xl text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-[#bbeeec] focus:bg-white focus:ring-4 focus:ring-[#4fd1c5]/10 transition-all">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3.5 bg-[#9a89df] hover:bg-[#8571d7] text-white font-semibold rounded-xl text-sm flex items-center justify-center gap-2 shadow-md shadow-[#9a89df]/25 transition-all transform active:scale-[0.99]">
                        Send Reset Link
                    </button>
                </div>

                <p class="text-xs text-gray-500 text-center pt-2">
                    Remember your password? <a href="/login" class="text-[#6366f1] font-semibold hover:underline">Sign in</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
